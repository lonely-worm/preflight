name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test, vet, build, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Run unit tests
        run: go test -race -v ./...
      - name: Run go vet
        run: go vet ./...
      - name: Build CLI
        run: go build -o ./preflight ./cmd/preflight
      - name: Smoke test clean directory
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ./preflight "$tmp"
      - name: Smoke test detection and redaction
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_abcdefghijklmnopqrstuvwxyz' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234' > "$tmp/sample.env"
          set +e
          output="$(./preflight -format json "$tmp" 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          echo "$output" | grep -q 'github-token'
          if echo "$output" | grep -q 'ghp_abcdefghijklmnopqrstuvwxyz'; then
            echo "Smoke test failed: secret value leaked into output"
            exit 1
          fi
