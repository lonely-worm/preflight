name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, vet, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Run unit tests
        run: go test -race -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build -trimpath -o ./preflight ./cmd/preflight

      - name: Smoke test clean directory
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ./preflight "$tmp"

      - name: Smoke test detection and redaction
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_abcdefghijklmnopqrstuvwxyz' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234' > "$tmp/sample.env"
          set +e
          output="$(./preflight -format json "$tmp" 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          echo "$output" | grep -q 'github-token'
          if echo "$output" | grep -q 'ghp_abcdefghijklmnopqrstuvwxyz'; then
            echo "Smoke test failed: secret value leaked into output"
            exit 1
          fi
