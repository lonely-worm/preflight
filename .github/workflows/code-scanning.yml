name: Preflight Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan repository and upload SARIF
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Generate SARIF report
        shell: bash
        run: |
          set +e
          go run ./cmd/preflight -format sarif . > preflight.sarif
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "Preflight failed to generate a SARIF report (exit $scan_status)."
            exit "$scan_status"
          fi
          test -s preflight.sarif
          echo "SARIF report generated. Exit $scan_status means findings may have been detected."

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: preflight.sarif
          category: preflight-secret-scanner
