name: Preflight Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan repository and upload SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Run tests
        run: go test ./...

      - name: Generate SARIF report
        shell: bash
        run: |
          set +e
          go run ./cmd/preflight -format sarif . > preflight.sarif
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "Preflight failed to generate a complete SARIF report (exit $scan_status)."
            exit "$scan_status"
          fi
          test -s preflight.sarif
          python3 -m json.tool preflight.sarif > /dev/null
          echo "SARIF 2.1.0 report generated; findings exit code was $scan_status."

      - name: Upload SARIF artifact
        if: always() && hashFiles('preflight.sarif') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: preflight-sarif-${{ github.run_id }}
          path: preflight.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: preflight.sarif
          category: preflight-secret-scanner
          wait-for-processing: true
